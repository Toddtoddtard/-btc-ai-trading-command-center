name: BTC Availability Watchdog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/health-watchdog.yml'
      - 'worker_watchdog.py'
      - 'app_healthcheck.py'
  schedule:
    - cron: '4-59/5 * * * *'
    - cron: '11 * * * *'
  workflow_run:
    workflows: ['BTC Political Event Watch', 'Train BTC Horizon Models', 'BTC AI 24x7 Learner']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: btc-availability-watchdog
  cancel-in-progress: false

jobs:
  recover-learner:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Request one stale-learner recovery if no run is active
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_VERIFY_ONLY: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'BTC AI 24x7 Learner' }}
        run: python worker_watchdog.py
  app-health:
    # Browser wake checks need not install Chromium every five minutes.
    # Run them hourly, on explicit changes, or after other periodic workers.
    if: (github.event_name == 'schedule' && github.event.schedule == '11 * * * *') || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.name != 'BTC AI 24x7 Learner')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Check public dashboard gate and wake app if needed
        run: python app_healthcheck.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-health
          path: health-artifacts/
          retention-days: 3
