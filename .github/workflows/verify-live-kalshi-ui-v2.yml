name: Verify Live Kalshi UI v2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-live-kalshi-ui-v2.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser deps
        run: |
          pip install playwright
          playwright install chromium
      - name: Verify active market and deployed UI across frames
        run: |
          python - <<'PY'
          import json, re, urllib.parse, urllib.request, time
          from playwright.sync_api import sync_playwright

          BASE='https://external-api.kalshi.com/trade-api/v2'
          APP='https://bettingbusa.streamlit.app/'
          q=urllib.parse.urlencode({'limit':100,'status':'open','series_ticker':'KXBTC15M'})
          with urllib.request.urlopen(BASE+'/markets?'+q, timeout=15) as r:
              data=json.load(r)
          markets=data.get('markets',[])
          assert markets, 'No active KXBTC15M market returned'
          m=markets[0]
          ticker=m.get('ticker')
          with urllib.request.urlopen(BASE+'/markets/'+ticker, timeout=15) as r:
              exact=json.load(r).get('market',{})
          text=' '.join(str(exact.get(k) or '') for k in ('yes_sub_title','subtitle','title'))
          hit=re.search(r'Target\s*Price\s*:\s*\$?([0-9][0-9,]*(?:\.[0-9]+)?)', text, re.I)
          assert hit, f'No explicit target found for {ticker}: {text}'
          target=float(hit.group(1).replace(',',''))
          target_fmt=f'${target:,.2f}'
          print('ACTIVE_TICKER', ticker)
          print('ACTIVE_TARGET', target_fmt)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1440,'height':1600})
              page.goto(APP, wait_until='domcontentloaded', timeout=120000)
              # Streamlit and custom components can take time to mount.
              page.wait_for_timeout(25000)

              # Collect text from the top page and every iframe/component frame.
              texts=[]
              for i,fr in enumerate(page.frames):
                  try:
                      t=fr.locator('body').inner_text(timeout=10000)
                  except Exception:
                      t=''
                  print(f'FRAME_{i}_URL', fr.url)
                  print(f'FRAME_{i}_TEXT', t[:4000])
                  texts.append(t)
              all_text='\n'.join(texts)

              # Timer: title plus a live MM:SS countdown must be present somewhere.
              assert 'Kalshi 15m Timer' in all_text, 'Kalshi timer card not visible in any frame'
              countdowns=re.findall(r'\b(?:[0-1]?\d):[0-5]\d\b', all_text)
              assert countdowns, 'Countdown MM:SS not visible in any frame'
              print('COUNTDOWNS', countdowns[:10])

              # Target: accept either exact formatted target in visible text or a Plotly annotation
              # whose text contains the exact target inside any component frame.
              target_seen = target_fmt in all_text
              if not target_seen:
                  for fr in page.frames:
                      try:
                          svg_text=' '.join(fr.locator('svg text').all_inner_texts())
                      except Exception:
                          svg_text=''
                      if target_fmt in svg_text:
                          target_seen=True
                          break
              assert target_seen, f'Expected live target {target_fmt} not visible in deployed UI/components'

              # Active ticker should be visible either in page text or chart status text.
              ticker_seen = ticker in all_text
              if not ticker_seen:
                  for fr in page.frames:
                      try:
                          html=fr.content()
                      except Exception:
                          html=''
                      if ticker in html:
                          ticker_seen=True
                          break
              assert ticker_seen, f'Expected active ticker {ticker} not present in deployed UI/components'

              # Verify the countdown is actually changing, not frozen.
              first=countdowns[0]
              page.wait_for_timeout(2500)
              texts2=[]
              for fr in page.frames:
                  try: texts2.append(fr.locator('body').inner_text(timeout=5000))
                  except Exception: pass
              all_text2='\n'.join(texts2)
              countdowns2=re.findall(r'\b(?:[0-1]?\d):[0-5]\d\b', all_text2)
              assert countdowns2 and countdowns2[0] != first, f'Countdown appears frozen at {first}'
              print('COUNTDOWN_CHANGED', first, '->', countdowns2[0])
              browser.close()

          print('LIVE_UI_VERIFIED')
          PY
