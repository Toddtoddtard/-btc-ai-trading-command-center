name: Smooth live chart browser check
on:
  pull_request:
    paths: ['app.py', 'scripts/check_smooth_chart.py', '.github/workflows/smooth-chart.yml']
  push:
    branches: [main]
    paths: ['app.py', 'scripts/check_smooth_chart.py', '.github/workflows/smooth-chart.yml']
permissions:
  contents: read
jobs:
  browser:
    # Keep Playwright 1.55 on its supported OS; ubuntu-latest is now 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_smooth_chart.py
