name: Global metric right-padding fix

on:
  push:
    paths:
      - 'app.py'
      - '.github/workflows/global-metric-padding-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate app syntax
        run: python -m py_compile app.py
      - name: Verify metric padding is installed
        run: |
          grep -q 'padding-right: .65rem !important;' app.py
          grep -q 'padding-right: .20rem !important;' app.py
