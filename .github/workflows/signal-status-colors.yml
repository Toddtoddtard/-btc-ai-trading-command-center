name: Signal status colors

on:
  push:
    paths:
      - '.github/workflows/signal-status-colors.yml'
      - 'scripts/apply_signal_status_colors.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply signal status colors
        run: python scripts/apply_signal_status_colors.py
      - name: Validate app
        run: python -m py_compile app.py
      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No app.py changes to commit."
            exit 0
          fi
          git commit -m "Color auto paper status by trade direction"
          git push origin main
