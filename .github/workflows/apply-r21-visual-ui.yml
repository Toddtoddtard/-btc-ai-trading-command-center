name: Apply R21 Visual UI

on:
  push:
    paths:
      - '.github/workflows/apply-r21-visual-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python apply_r21_visual_ui.py
      - run: |
          git config user.name "btc-ai-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git commit -m "Restyle dashboard to match dark command center mockup"
          git push origin main
