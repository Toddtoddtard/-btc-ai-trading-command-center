name: BTC Full Audit v17

# Immediate full audit requested 2026-09-13; includes journal grading repair.
on:
  pull_request:
    paths:
      - 'app.py'
      - 'ai_core.py'
      - 'council_v4.py'
      - 'reliability_v31.py'
      - 'specialist_knowledge_v5.py'
      - 'historical_specialist_backtest_v7.py'
      - 'historical_backtest.py'
      - 'learner.py'
      - 'learner_v3.py'
      - 'learner_v31.py'
      - 'shared_learning.py'
      - 'profitability_v5.py'
      - 'bot_intelligence_dashboard.py'
      - 'bot_intelligence_report.py'
      - 'multi_asset_command_center.py'
      - 'multi_asset_theme.py'
      - 'multi_market_nav.py'
      - 'market_command_center_shell.py'
      - 'market_guide.py'
      - 'political_event_monitor.py'
      - 'political_event_watch.py'
      - 'requirements.txt'
      - 'learner-requirements.txt'
      - 'pages/**'
      - 'tests/**'
      - 'tools/**'
      - 'scripts/**'
      - '.github/workflows/btc-audit-v16.yml'
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'ai_core.py'
      - 'council_v4.py'
      - 'reliability_v31.py'
      - 'specialist_knowledge_v5.py'
      - 'historical_specialist_backtest_v7.py'
      - 'historical_backtest.py'
      - 'learner.py'
      - 'learner_v3.py'
      - 'learner_v31.py'
      - 'shared_learning.py'
      - 'profitability_v5.py'
      - 'bot_intelligence_dashboard.py'
      - 'bot_intelligence_report.py'
      - 'multi_asset_command_center.py'
      - 'multi_asset_theme.py'
      - 'multi_market_nav.py'
      - 'market_command_center_shell.py'
      - 'market_guide.py'
      - 'political_event_monitor.py'
      - 'political_event_watch.py'
      - 'requirements.txt'
      - 'learner-requirements.txt'
      - 'pages/**'
      - 'tests/**'
      - 'tools/**'
      - 'scripts/**'
      - '.github/workflows/btc-audit-v16.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply audited BTC decision policy safely
        run: python tools/apply_btc_audit_v16.py
      - name: Repair prediction journal directional grading
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '''            strike = safe_float(row["target_price"])

            if action in {"SCALP UP", "LOCK UP"}:
                correct = int(resolved_price >= strike) if pd.notna(strike) else int(resolved_price > start_price)
            elif action in {"SCALP DOWN", "LOCK DOWN"}:
                correct = int(resolved_price < strike) if pd.notna(strike) else int(resolved_price < start_price)
            else:
                correct = None
'''
          new = '''            # Grade the prediction journal by BTC direction from the call price.
            # Kalshi contract settlement is authoritative only in the paper ledger.
            if action in {"SCALP UP", "LOCK UP"}:
                correct = int(resolved_price > start_price)
            elif action in {"SCALP DOWN", "LOCK DOWN"}:
                correct = int(resolved_price < start_price)
            else:
                correct = None
'''
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
              print('Repaired journal grading.')
          elif 'correct = int(resolved_price > start_price)' in s and 'correct = int(resolved_price < start_price)' in s:
              print('Journal grading already repaired.')
          else:
              raise SystemExit('Unexpected journal grading block; refusing blind edit.')
          PY
      - name: Compile every Python file
        run: python -m compileall -q .
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify repaired call path exists
        run: |
          grep -q 'forecast_move >= max(atr \* 0.14, px \* 0.00014)' app.py
          grep -q 'forecast_move <= -max(atr \* 0.14, px \* 0.00014)' app.py
          grep -q 'consensus >= 0.12' app.py
          grep -q 'not up_market_conflict' app.py
          grep -q 'not down_market_conflict' app.py
          grep -q 'Political Event Watch AI' ai_core.py
          ! grep -q 'official/verified handle' political_event_monitor.py
          grep -q '_journal_resolved' app.py
          grep -q 'display_position_side' app.py
          grep -q '_status_side' app.py
      - name: Install audited app policy on main
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- app.py; then
            echo 'BTC app policy already installed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Fix prediction journal directional grading'
          git push origin main
