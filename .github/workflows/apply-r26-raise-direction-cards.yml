name: Apply R26 Raise Direction Cards

on:
  workflow_dispatch:
  push:
    paths:
      - 'apply_r26_raise_direction_cards.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply visual alignment patch
        run: python apply_r26_raise_direction_cards.py
      - name: Validate syntax
        run: python -m py_compile app.py
      - name: Commit updated app
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes needed."
            exit 0
          fi
          git config user.name "btc-ai-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git commit -m "Raise directional badges inside blue cards"
          git push origin main
