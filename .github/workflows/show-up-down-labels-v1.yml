name: Show UP DOWN paper position labels

on:
  push:
    paths:
      - 'app.py'
      - '.github/workflows/show-up-down-labels-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate app syntax
        run: python -m py_compile app.py
      - name: Verify UP DOWN position labels are installed
        run: |
          grep -q 'def display_position_side(side):' app.py
          grep -q 'LONG (UP)' app.py
          grep -q 'SHORT (DOWN)' app.py
