name: BTC AI Ten-Year Walk-Forward v10

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'historical_specialist_backtest_v7.py'
      - 'ai_core.py'
      - 'council_v4.py'
      - 'market_research.py'
      - '.github/workflows/historical-specialist-v7.yml'

permissions:
  contents: write

concurrency:
  group: btc-ai-historical-specialist-v10
  cancel-in-progress: false

jobs:
  specialist-history:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r learner-requirements.txt
      - name: Compile evaluator
        run: python -m py_compile historical_specialist_backtest_v7.py ai_core.py market_research.py reliability_v31.py
      - name: Run up-to-ten-year specialist walk-forward
        env:
          HISTORICAL_SPECIALIST_OUTPUT: /tmp/historical_specialist_knowledge_v7.json
          HISTORICAL_YEARS: "10"
          HISTORICAL_HOLDOUT_YEARS: "2"
        run: python historical_specialist_backtest_v7.py
      - name: Validate report
        run: |
          python - <<'PY'
          import json
          p='/tmp/historical_specialist_knowledge_v7.json'
          d=json.load(open(p))
          assert d.get('version') == 10
          assert d.get('period_requested_years') == 10
          assert d.get('actual_coverage_years', 0) >= 8.0
          assert d.get('walk_forward') is True
          assert d.get('evaluated_windows', 0) >= 10000
          bots=d.get('specialists', {})
          required={'Trend AI','Momentum AI','Volume AI','Pattern AI','Support/Resistance AI','Volatility AI','Market Regime AI','Historical Pattern AI','FVG / MACD AI'}
          assert required.issubset(bots)
          for name in required:
              assert bots[name].get('samples', 0) > 1000
              assert isinstance(bots[name].get('regimes', {}), dict)
          council=d.get('overall_council', {})
          holdout=d.get('holdout', {})
          assert council.get('directional_calls', 0) > 1000
          qualified=d.get('qualified_ohlcv_council', {})
          assert qualified.get('directional_calls', 0) > 100
          assert 0.0 <= qualified.get('accuracy', -1.0) <= 1.0
          assert holdout.get('evaluated_windows', 0) > 10000
          assert holdout.get('overall_council', {}).get('directional_calls', 0) > 1000
          assert holdout.get('qualified_ohlcv_council', {}).get('directional_calls', 0) > 100
          assert required.issubset(holdout.get('specialists', {}))
          assert d.get('production_parameters_changed') is False
          print('validated', d['evaluated_windows'], 'historical windows; holdout', holdout['evaluated_windows'])
          PY
      - name: Publish report to learning-state branch
        shell: bash
        run: |
          set -e
          git config user.name 'btc-ai-historical-bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin learning-state:refs/remotes/origin/learning-state || true
          if git show-ref --verify --quiet refs/remotes/origin/learning-state; then
            git checkout -B learning-state refs/remotes/origin/learning-state
          else
            git checkout --orphan learning-state
            git rm -rf . || true
          fi
          cp /tmp/historical_specialist_knowledge_v7.json ./historical_specialist_knowledge_v7.json
          git add historical_specialist_knowledge_v7.json
          if git diff --cached --quiet; then
            echo 'No historical specialist report change.'
            exit 0
          fi
          git commit -m 'Update ten-year walk-forward priors v10'
          git push origin learning-state --force-with-lease
