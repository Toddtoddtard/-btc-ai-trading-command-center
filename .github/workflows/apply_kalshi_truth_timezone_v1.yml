name: Apply Kalshi Truth + Eastern Time v1

on:
  push:
    branches:
      - main
    paths:
      - 'tools/apply_kalshi_truth_timezone_v1.py'
      - 'tests/test_kalshi_truth_timezone_v1.py'
      - '.github/workflows/apply_kalshi_truth_timezone_v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-kalshi-truth-timezone-v1
  cancel-in-progress: false

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply source hotfix
        run: python tools/apply_kalshi_truth_timezone_v1.py

      - name: Compile changed Python
        run: python -m py_compile background_paper.py learner.py app.py tests/test_kalshi_truth_timezone_v1.py

      - name: Run focused regressions
        run: python -m unittest tests.test_background_paper tests.test_kalshi_truth_timezone_v1 -v

      - name: Commit safe hotfix to main
        shell: bash
        run: |
          set -e
          if git diff --quiet -- background_paper.py learner.py app.py; then
            echo 'Hotfix already applied; nothing to commit.'
            exit 0
          fi
          git config user.name 'chatgpt-hotfix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add background_paper.py learner.py app.py
          git commit -m 'Fix Kalshi settlement truth, rewards, and Eastern timestamps'
          git push origin HEAD:main
