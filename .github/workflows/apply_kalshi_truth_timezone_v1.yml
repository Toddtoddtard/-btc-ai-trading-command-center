name: Validate Kalshi Truth + Eastern Time v1

on:
  push:
    branches:
      - main
    paths:
      - 'tools/apply_kalshi_truth_timezone_v1.py'
      - 'tests/test_kalshi_truth_timezone_v1.py'
      - '.github/workflows/apply_kalshi_truth_timezone_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-kalshi-truth-timezone-v1
  cancel-in-progress: false

jobs:
  validate-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile protected Python
        run: python -m py_compile background_paper.py learner.py app.py tests/test_kalshi_truth_timezone_v1.py

      - name: Run focused regressions
        run: python -m unittest tests.test_background_paper tests.test_kalshi_truth_timezone_v1 -v
