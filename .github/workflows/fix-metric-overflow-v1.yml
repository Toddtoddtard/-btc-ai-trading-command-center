name: Fix metric value overflow

on:
  push:
    paths:
      - '.github/workflows/fix-metric-overflow-v1.yml'
      - 'scripts/fix_metric_overflow.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply metric overflow fix
        run: python scripts/fix_metric_overflow.py

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No app.py changes to commit."
            exit 0
          fi
          git commit -m "Make metric values fit without truncation"
          git push origin main
