name: Fix metric value overflow

on:
  push:
    paths:
      - '.github/workflows/fix-metric-overflow-v1.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Make metric values fit without ellipsis
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          text = p.read_text()
          old = '    [data-testid="stMetricValue"] {font-size: 1.55rem;}\n'
          new = '''    [data-testid="stMetricValue"] {
        font-size: clamp(.88rem, 1.55vw, 1.55rem) !important;
        line-height: 1.15 !important;
        white-space: nowrap !important;
        overflow: visible !important;
        text-overflow: clip !important;
        min-width: 0 !important;
    }
    [data-testid="stMetricValue"] > div,
    [data-testid="stMetricValue"] p {
        font-size: inherit !important;
        line-height: inherit !important;
        white-space: nowrap !important;
        overflow: visible !important;
        text-overflow: clip !important;
        max-width: none !important;
    }
    [data-testid="stMetric"] {
        min-width: 0 !important;
    }
'''
          if old not in text:
              raise SystemExit('Metric value style anchor not found; refusing partial update')
          text = text.replace(old, new, 1)
          text = text.replace('APP_VERSION = "2026.09.05-r48-paper-bet-size"', 'APP_VERSION = "2026.09.05-r49-metric-fit"', 1)
          p.write_text(text)
          PY

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No app.py changes to commit."
            exit 0
          fi
          git commit -m "Make metric values fit without truncation"
          git push origin main
