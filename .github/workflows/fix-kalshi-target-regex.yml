name: Fix Kalshi Target Regex
on:
  workflow_dispatch:
  push:
    paths:
      - 'fix_kalshi_target_regex.py'
      - '.github/workflows/fix-kalshi-target-regex.yml'
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply target regex fix
        run: python fix_kalshi_target_regex.py
      - name: Compile
        run: python -m py_compile app.py learner.py
      - name: Verify explicit target parser
        run: |
          python - <<'PY'
          import re
          text='Target Price: $81,234.56'
          pat=re.compile(r'Target\s*Price\s*:\s*\$?([0-9][0-9,]*(?:\.[0-9]+)?)', re.I)
          m=pat.search(text)
          assert m and m.group(1)=='81,234.56'
          print('target regex ok')
          PY
          grep -q 'Target\\s\*Price' app.py
      - name: Commit repair
        run: |
          if git diff --quiet -- app.py learner.py; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'btc-ai-fix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py learner.py
          git commit -m 'Restore Kalshi 15m target price parsing'
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 2
          done
          exit 1
