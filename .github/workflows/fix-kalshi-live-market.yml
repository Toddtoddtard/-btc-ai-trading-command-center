name: Fix Kalshi Live Market
on:
  workflow_dispatch:
  push:
    paths:
      - 'fix_kalshi_live_market.py'
      - '.github/workflows/fix-kalshi-live-market.yml'
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply live market fix
        run: python fix_kalshi_live_market.py
      - name: Compile
        run: python -m py_compile app.py learner.py ai_core.py
      - name: Verify market selection logic
        run: |
          grep -q 'deterministic-exact-ticker' app.py
          grep -q '_kalshi_15m_ticker' app.py
          grep -q 'schedule-only-fallback' app.py
          grep -q 'fetch_exact_kalshi_market' app.py
      - name: Commit repair
        run: |
          git config user.name "btc-ai-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Make Kalshi 15m timer and target deterministic"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 2
          done
          exit 1
