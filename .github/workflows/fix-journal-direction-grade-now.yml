name: Fix journal directional grading now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-journal-direction-grade-now.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fix directional journal grading
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '''            strike = safe_float(row["target_price"])

            if action in {"SCALP UP", "LOCK UP"}:
                correct = int(resolved_price >= strike) if pd.notna(strike) else int(resolved_price > start_price)
            elif action in {"SCALP DOWN", "LOCK DOWN"}:
                correct = int(resolved_price < strike) if pd.notna(strike) else int(resolved_price < start_price)
            else:
                correct = None
'''
          new = '''            # The prediction journal scores the bot's directional call.
            # Kalshi contract settlement is tracked separately by the paper ledger.
            if action in {"SCALP UP", "LOCK UP"}:
                correct = int(resolved_price > start_price)
            elif action in {"SCALP DOWN", "LOCK DOWN"}:
                correct = int(resolved_price < start_price)
            else:
                correct = None
'''
          if old not in s:
              raise SystemExit('journal grading block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Compile
        run: python -m compileall -q .
      - name: Run full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Fix prediction journal directional grading'
          git push origin main
