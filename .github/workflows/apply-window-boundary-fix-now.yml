name: Apply 15-minute window boundary fix now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-window-boundary-fix-now.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply exact-window pending-settlement fix
        run: python tools/apply_window_boundary_pending_settlement.py
      - name: Compile all Python
        run: python -m compileall -q .
      - name: Run full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit only after tests pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kalshi_paper_engine.py background_paper.py tests/test_settlement_rollover.py
          git commit -m 'End paper calls at exact 15-minute window boundary'
          git push origin main
