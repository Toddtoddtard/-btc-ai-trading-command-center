name: Apply R30 Kalshi Sidebar Timer

on:
  workflow_dispatch:
  push:
    paths:
      - 'apply_r30_kalshi_sidebar_timer.py'
      - '.github/workflows/apply-r30-kalshi-sidebar-timer.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply timer patch
        run: python apply_r30_kalshi_sidebar_timer.py
      - name: Compile app
        run: python -m py_compile app.py
      - name: Verify timer markers
        run: |
          grep -q "Kalshi 15m Timer" app.py
          grep -q "kalshi-sidebar-timer" app.py
          grep -q "series_ticker=KXBTC15M" app.py
      - name: Commit app safely
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes needed."
            exit 0
          fi
          git config user.name "btc-ai-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git commit -m "Add live Kalshi 15m countdown above Command Center"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 2
          done
          exit 1
