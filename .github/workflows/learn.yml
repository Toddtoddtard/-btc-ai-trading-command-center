name: BTC AI 24x7 Learner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'prediction_journal.py'
      - 'tests/test_persistent_journal.py'
      - 'learner.py'
      - 'learner_v3.py'
      - 'learner_v31.py'
      - 'hourly_forecast.py'
      - 'tests/test_hourly_forecast.py'
      - 'lock_focus.py'
      - 'forward_outlook.py'
      - 'reliability_v31.py'
      - 'ai_core.py'
      - 'horizon_models.py'
      - 'candle_learning.py'
      - 'contract_calibration.py'
      - 'contract_probability.py'
      - 'settlement_predictor.py'
      - 'kalshi_chart_data.py'
      - 'tests/test_settlement_predictor.py'
      - 'tests/test_settlement_evidence.py'
      - 'tests/test_paper_liquidity.py'
      - 'council_accounting.py'
      - 'outcome_timing.py'
      - 'contribution_evidence.py'
      - 'tests/test_council_evidence.py'
      - 'tests/test_official_calibration.py'
      - 'signal_education.py'
      - 'tests/test_signal_education.py'
      - 'multi_timeframe.py'
      - 'kalshi_microstructure.py'
      - 'market_research.py'
      - 'council_v4.py'
      - 'bot_intelligence_report.py'
      - 'specialist_knowledge_v5.py'
      - 'enrich_learning_state_v5.py'
      - 'profitability_v5.py'
      - 'time_rewards_v1.py'
      - 'audit_scorecard_v7.py'
      - 'research_lab.py'
      - 'research_dashboard.py'
      - 'external_teacher_lab.py'
      - 'tests/test_external_teacher_lab.py'
      - 'tests/test_research_lab.py'
      - 'tests/test_lock_focus.py'
      - 'shared_learning.py'
      - 'tests/test_shared_learning.py'
      - 'tests/test_audit_v6.py'
      - 'tests/test_market_research.py'
      - 'background_paper.py'
      - 'multi_asset_paper.py'
      - 'multi_asset_command_center.py'
      - 'tests/test_multi_asset_paper.py'
      - 'tests/test_background_paper.py'
      - 'kalshi_paper_engine.py'
      - 'worker_session.py'
      - 'scripts/validate_learning_state.py'
      - 'tests/test_worker_session.py'
      - '.github/workflows/learn.yml'
  schedule:
    # Avoid the top-of-hour scheduling peak. GitHub cron is still best effort.
    - cron: "2-57/5 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: btc-ai-learning-state
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout app code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install learner dependencies
        run: pip install -r learner-requirements.txt
      - name: Validate learner code
        run: python -m py_compile hourly_forecast.py tests/test_hourly_forecast.py learner.py learner_v3.py learner_v31.py lock_focus.py forward_outlook.py reliability_v31.py ai_core.py horizon_models.py multi_timeframe.py kalshi_microstructure.py market_research.py council_v4.py bot_intelligence_report.py specialist_knowledge_v5.py enrich_learning_state_v5.py profitability_v5.py time_rewards_v1.py audit_scorecard_v7.py background_paper.py multi_asset_paper.py external_teacher_lab.py research_lab.py research_dashboard.py shared_learning.py tests/test_horizon_models.py tests/test_multi_timeframe.py tests/test_train_horizon_models.py tests/test_audit_v6.py tests/test_market_research.py tests/test_background_paper.py tests/test_multi_asset_paper.py tests/test_external_teacher_lab.py tests/test_research_lab.py tests/test_lock_focus.py tests/test_forward_outlook.py tests/test_shared_learning.py
      - name: Verify candle catch-up and leakage protection
        run: python -m unittest tests.test_worker_session tests.test_worker_watchdog tests.test_candle_learning tests.test_signal_education -v
      - name: Verify shared council and official scoring
        run: python -m unittest tests.test_settlement_predictor tests.test_settlement_evidence tests.test_paper_liquidity tests.test_council_parity tests.test_council_evidence tests.test_official_calibration tests.test_state_preservation tests.test_persistent_journal -v
      - name: Run audit v6 regression tests
        run: python -m unittest tests.test_hourly_forecast tests.test_horizon_models tests.test_multi_timeframe tests.test_train_horizon_models tests.test_audit_v6 tests.test_market_research tests.test_background_paper tests.test_multi_asset_paper tests.test_external_teacher_lab tests.test_research_lab tests.test_lock_focus tests.test_forward_outlook tests.test_shared_learning -v
      - name: Load previous private learning state and historical priors
        shell: bash
        run: |
          set -e
          rm -f /tmp/previous_learning_state.json /tmp/historical_specialist_knowledge_v7.json /tmp/horizon_models.json
          git fetch --depth=1 origin +learning-state:refs/remotes/origin/learning-state
          if git show-ref --verify --quiet refs/remotes/origin/learning-state; then
            git show refs/remotes/origin/learning-state:learning_state.json > /tmp/previous_learning_state.json
            git show refs/remotes/origin/learning-state:historical_specialist_knowledge_v7.json > /tmp/historical_specialist_knowledge_v7.json || true
            git show refs/remotes/origin/learning-state:horizon_models.json > /tmp/horizon_models.json || true
          fi
          if [ -s /tmp/previous_learning_state.json ]; then
            python - <<'PY'
          import json
          p='/tmp/previous_learning_state.json'
          data=json.load(open(p))
          print('Loaded previous learning state with', data.get('forecast', {}).get('samples', 0), 'graded samples')
          PY
          else
            echo "Authoritative learning state is missing; refusing to reset history or bankroll."
            exit 1
          fi
          if [ -s /tmp/historical_specialist_knowledge_v7.json ]; then
            python - <<'PY'
          import json
          p='/tmp/historical_specialist_knowledge_v7.json'
          data=json.load(open(p))
          print('Loaded historical specialist report v%s with' % data.get('version', 'unknown'), data.get('evaluated_windows', 0), 'windows')
          PY
          else
            echo "Historical specialist v7 report not available yet; live learner continues without it."
          fi
      - name: Run BTC AI learner v3.1
        env:
          LEARNING_STATE_INPUT: /tmp/previous_learning_state.json
          LEARNING_STATE_OUTPUT: /tmp/learning_state.json
          HORIZON_MODELS_INPUT: /tmp/horizon_models.json
        run: python learner_v31.py
      - name: Run Bot Intelligence v4 contribution analysis
        env:
          LEARNING_STATE_INPUT: /tmp/learning_state.json
          LEARNING_STATE_OUTPUT: /tmp/learning_state_v4.json
        run: |
          python bot_intelligence_report.py
          mv /tmp/learning_state_v4.json /tmp/learning_state.json
      - name: Enrich specialist self-learning knowledge
        env:
          LEARNING_STATE_OUTPUT: /tmp/learning_state.json
          HISTORICAL_SPECIALIST_INPUT: /tmp/historical_specialist_knowledge_v7.json
        run: python enrich_learning_state_v5.py
      - name: Update Audit v6 milestone scorecard
        env:
          LEARNING_STATE_OUTPUT: /tmp/learning_state.json
        run: python audit_scorecard_v7.py
      - name: Run persistent 24/7 Kalshi paper cycle
        env:
          LEARNING_STATE_OUTPUT: /tmp/learning_state.json
          BACKGROUND_PAPER_CYCLES: "4"
          BACKGROUND_PAPER_INTERVAL_SECONDS: "30"
        shell: bash
        run: |
          # Keep the private-runner workload sustainable. Streamlit evaluates
          # the same paper engine every second while the dashboard is open;
          # this scheduled cycle provides the unattended checkpoint. Short
          # retries can capture a strategy-eligible quote (LOCK <=93%, SCALP <=75%) without changing any gate.
          python background_paper.py
      - name: Run persistent Gold, Gas, ZEC and WTI AUTO PAPER cycles
        run: python multi_asset_paper.py --state /tmp/learning_state.json
      - name: Validate generated learning state
        run: python scripts/validate_learning_state.py
      - name: Publish learning state without replacing runner code
        run: python worker_session.py --publish-only
      - name: Continue learning and paper checkpoints between scheduled starts
        env:
          LEARNING_STATE_INPUT: /tmp/previous_learning_state.json
          LEARNING_STATE_OUTPUT: /tmp/learning_state.json
          HORIZON_MODELS_INPUT: /tmp/horizon_models.json
          HISTORICAL_SPECIALIST_INPUT: /tmp/historical_specialist_knowledge_v7.json
          BACKGROUND_PAPER_CYCLES: "4"
          BACKGROUND_PAPER_INTERVAL_SECONDS: "30"
          # A new main revision proves its first handoff quickly. Successors
          # use the full session; no dependence on a second cron event.
          WORKER_SESSION_MINUTES: ${{ github.event_name == 'push' && '12' || '55' }}
        run: python -u worker_session.py --minutes "$WORKER_SESSION_MINUTES"
      - name: Queue the next learner before this worker finishes
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_HANDOFF_RUN_ID: ${{ github.run_id }}
        run: python worker_watchdog.py
