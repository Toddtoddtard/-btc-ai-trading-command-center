name: BTC AI 24x7 Learner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'learner.py'
      - 'learner_v3.py'
      - 'learner_v31.py'
      - 'reliability_v31.py'
      - 'ai_core.py'
      - 'council_v4.py'
      - 'bot_intelligence_report.py'
      - 'specialist_knowledge_v5.py'
      - 'enrich_learning_state_v5.py'
      - 'profitability_v5.py'
      - 'tests/test_audit_v6.py'
      - '.github/workflows/learn.yml'
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: btc-ai-learning-state
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout app code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install learner dependencies
        run: pip install -r learner-requirements.txt
      - name: Validate learner code
        run: python -m py_compile learner.py learner_v3.py learner_v31.py reliability_v31.py ai_core.py council_v4.py bot_intelligence_report.py specialist_knowledge_v5.py enrich_learning_state_v5.py profitability_v5.py tests/test_audit_v6.py
      - name: Run audit v6 regression tests
        run: python -m unittest tests.test_audit_v6 -v
      - name: Load previous private learning state
        shell: bash
        run: |
          set -e
          rm -f /tmp/previous_learning_state.json
          git fetch origin learning-state:refs/remotes/origin/learning-state || true
          if git show-ref --verify --quiet refs/remotes/origin/learning-state; then
            git show refs/remotes/origin/learning-state:learning_state.json > /tmp/previous_learning_state.json || true
          fi
          if [ -s /tmp/previous_learning_state.json ]; then
            python - <<'PY'
          import json
          p='/tmp/previous_learning_state.json'
          data=json.load(open(p))
          print('Loaded previous learning state with', data.get('forecast', {}).get('samples', 0), 'graded samples')
          PY
          else
            echo "No previous learning state found; learner will use fallback state."
          fi
      - name: Run BTC AI learner v3.1
        env:
          LEARNING_STATE_INPUT: /tmp/previous_learning_state.json
          LEARNING_STATE_OUTPUT: /tmp/learning_state.json
        run: python learner_v31.py
      - name: Run Bot Intelligence v4 contribution analysis
        env:
          LEARNING_STATE_INPUT: /tmp/learning_state.json
          LEARNING_STATE_OUTPUT: /tmp/learning_state_v4.json
        run: |
          python bot_intelligence_report.py
          mv /tmp/learning_state_v4.json /tmp/learning_state.json
      - name: Enrich specialist self-learning v5 knowledge
        env:
          LEARNING_STATE_OUTPUT: /tmp/learning_state.json
        run: python enrich_learning_state_v5.py
      - name: Validate generated learning state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/learning_state.json')
          data=json.loads(p.read_text())
          assert data.get('version') == 31
          assert data.get('status', {}).get('worker_ok') is True
          assert data.get('status', {}).get('shared_core') is True
          assert data.get('status', {}).get('learning_version') == 31
          assert data.get('status', {}).get('strict_expiry_grading') is True
          assert data.get('status', {}).get('bot_intelligence_v4_ok') is True
          assert data.get('status', {}).get('specialist_self_learning_v5') is True
          assert data.get('status', {}).get('intelligence_version') == 5
          assert data.get('status', {}).get('regime_tagged_specialist_history') is True
          assert data.get('status', {}).get('current_regime') in {'HIGH_VOL', 'TREND_UP', 'TREND_DOWN', 'LOW_VOL_RANGE', 'RANGE'}
          assert data.get('status', {}).get('specialist_knowledge_regime') == data.get('status', {}).get('current_regime') or data.get('specialist_knowledge_v5', {}).get('regime') == data.get('pending', {}).get('regime')
          assert 'Kalshi Context AI' in data.get('specialists', {})
          assert 'Event AI' not in data.get('specialists', {})
          assert 'rolling' in data
          assert 'regimes' in data
          assert 'confidence_model' in data
          assert 'wait_policy' in data
          assert 'validation' in data
          assert 'champion_challenger' in data
          assert data.get('champion_challenger', {}).get('minimum_samples') == 20
          assert data.get('champion_challenger', {}).get('required_streak') == 3
          assert 'prediction_snapshots' in data
          assert 'wait_counterfactual' in data
          assert 'bot_intelligence_v4' in data
          assert isinstance(data.get('bot_intelligence_v4', {}).get('ranking', []), list)
          assert 'specialist_knowledge_v5' in data
          assert isinstance(data.get('specialist_knowledge_v5', {}).get('bots', {}), dict)
          before=int(data.get('status', {}).get('samples_before_run', 0))
          after=int(data.get('status', {}).get('samples_after_run', 0))
          assert after >= before, (before, after)
          print('learning-state v3.1 + v4 + Specialist Intelligence v5 + Audit v6 validation passed; samples', before, '->', after)
          PY
      - name: Publish learning state
        shell: bash
        run: |
          set -e
          git config user.name "btc-ai-learning-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin learning-state:refs/remotes/origin/learning-state || true
          if git show-ref --verify --quiet refs/remotes/origin/learning-state; then
            git checkout -B learning-state refs/remotes/origin/learning-state
          else
            git checkout --orphan learning-state
            git rm -rf . || true
          fi
          cp /tmp/learning_state.json ./learning_state.json
          git add learning_state.json
          if git diff --cached --quiet; then
            echo "No learning-state change to publish."
            exit 0
          fi
          git commit -m "Update BTC AI learning state with Specialist Intelligence v5"
          git push origin learning-state --force-with-lease
