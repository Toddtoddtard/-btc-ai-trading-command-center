name: Verify Kalshi Deployment
on:
  push:
    paths:
      - '.github/workflows/verify-kalshi-deployment.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify live Kalshi and deployed UI
        run: |
          python - <<'PY'
          import json,re,time,urllib.parse,urllib.request
          from playwright.sync_api import sync_playwright
          base='https://external-api.kalshi.com/trade-api/v2'
          q=urllib.parse.urlencode({'limit':100,'status':'open','series_ticker':'KXBTC15M'})
          req=urllib.request.Request(base+'/markets?'+q,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=15) as r:
              markets=json.load(r).get('markets',[])
          now=time.time(); future=[]
          for m in markets:
              raw=m.get('close_time') or m.get('expected_expiration_time') or m.get('expiration_time')
              try:
                  ts=__import__('datetime').datetime.fromisoformat(str(raw).replace('Z','+00:00')).timestamp()
              except Exception:
                  continue
              if ts>now and str(m.get('ticker','')).startswith('KXBTC15M-'):
                  future.append((ts,m))
          assert future, 'No active future KXBTC15M market found'
          _,m=min(future,key=lambda x:x[0])
          ticker=m['ticker']
          req=urllib.request.Request(base+'/markets/'+urllib.parse.quote(ticker),headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=15) as r:
              exact=json.load(r).get('market',{})
          text=' '.join(str(exact.get(k) or '') for k in ('yes_sub_title','subtitle','title'))
          hit=re.search(r'Target\s*Price\s*:\s*\$?([0-9][0-9,]*(?:\.[0-9]+)?)',text,re.I)
          target=float(hit.group(1).replace(',','')) if hit else float(exact.get('floor_strike') or exact.get('cap_strike') or 0)
          assert target>0, 'Active market has no target'
          print('ACTIVE',ticker,'TARGET',f'{target:.2f}')
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1440,'height':1600})
              page.goto('https://bettingbusa.streamlit.app/',wait_until='domcontentloaded',timeout=120000)
              page.wait_for_timeout(15000)
              body=page.locator('body').inner_text(timeout=30000)
              print('BODY_START')
              print(body[:16000])
              print('BODY_END')
              assert 'BTC AI Trading Command Center' in body, 'Deployment did not render command center'
              # A working timer must display mm:ss (not --:--) somewhere in the rendered app.
              timers=re.findall(r'\b(?:0?[0-9]|1[0-5]):[0-5][0-9]\b',body)
              assert timers, 'No live countdown-style mm:ss value found'
              assert '--:--' not in body, 'Countdown still shows --:--'
              # The current exact Kalshi target must be visible, allowing comma formatting.
              variants={f'${target:,.2f}',f'{target:,.2f}',f'${target:.2f}',f'{target:.2f}'}
              assert any(v in body for v in variants), f'Live target {target:.2f} not visible in deployed UI'
              print('TIMERS',timers[:10])
              print('DEPLOYED_TARGET_VISIBLE',target)
              browser.close()
          PY
