name: Apply R19 Audit Fix

on:
  push:
    paths:
      - '.github/workflows/apply-r19-audit-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python apply_learner_audit_fix.py
      - run: |
          git config user.name "btc-ai-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add learner.py
          git commit -m "Audit learner target and specialist live feeds"
          git push origin main
