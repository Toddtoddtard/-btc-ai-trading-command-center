name: Apply R29 Audit Fixes

on:
  workflow_dispatch:
  push:
    paths:
      - 'apply_r29_audit_fixes.py'
      - '.github/workflows/apply-r29-audit-fixes.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply audit fixes
        run: python apply_r29_audit_fixes.py
      - name: Compile all Python
        run: python -m py_compile app.py learner.py ai_core.py
      - name: Shared-core smoke test
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          from ai_core import enrich_history_core, forecast_path_core, run_specialists_core

          n=80
          close=np.linspace(80000,80200,n)+np.sin(np.arange(n))*12
          df=pd.DataFrame({
              'open':close-3,'high':close+18,'low':close-18,'close':close,
              'volume':np.linspace(10,15,n),'time':pd.date_range('2026-01-01',periods=n,freq='min',tz='UTC')
          })
          df=enrich_history_core(df)
          agg=pd.DataFrame([
              {'notional':100000.0,'aggressor':'BUY'},
              {'notional':70000.0,'aggressor':'SELL'},
              {'notional':250000.0,'aggressor':'BUY'},
          ])
          k={'available':True,'target':80150.0,'up_probability':0.55,'distance':50.0,'distance_pct':50/80150}
          results=run_specialists_core(df,agg,{'book_imbalance':0.05,'funding_rate':0.0001,'open_interest':1000},k)
          assert len(results)==13
          assert 'Kalshi Context AI' in results and 'Event AI' not in results
          rows=df.tail(60)[['open','high','low','close']].to_dict('records')
          f=forecast_path_core(rows,80150.0,{})
          assert f and len(f['forecast'])==15
          assert np.isfinite(f['predicted_end'])
          print('shared core smoke test passed')
          PY
      - name: Commit updated app
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes needed."
            exit 0
          fi
          git config user.name "btc-ai-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git commit -m "Unify app and learner AI core and fix grading discrepancies"
          git fetch origin main
          git rebase origin/main
          git push origin main
