name: Apply R22 Signal Badges

on:
  push:
    paths:
      - '.github/workflows/apply-r22-signal-badges.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python apply_r22_signal_badges.py
      - run: |
          git config user.name "btc-ai-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git commit -m "Add bullish and bearish signal badges"
          git push origin main
