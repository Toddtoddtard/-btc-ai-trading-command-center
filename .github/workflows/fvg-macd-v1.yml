name: Install FVG MACD technical AI

on:
  push:
    paths:
      - 'technical_fvg_macd.py'
      - 'tools/apply_fvg_macd_v1.py'
      - '.github/workflows/fvg-macd-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas plotly streamlit
      - name: Apply FVG MACD integration
        run: python tools/apply_fvg_macd_v1.py
      - name: Validate Python
        run: python -m py_compile app.py ai_core.py council_v4.py technical_fvg_macd.py council_backtest_v4.py historical_specialist_backtest_v7.py
      - name: Run targeted tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit integrated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py ai_core.py council_v4.py council_backtest_v4.py historical_specialist_backtest_v7.py README.md
          if git diff --cached --quiet; then
            echo "FVG/MACD integration already installed."
            exit 0
          fi
          git commit -m "Integrate FVG MACD technical AI"
          git push origin main
