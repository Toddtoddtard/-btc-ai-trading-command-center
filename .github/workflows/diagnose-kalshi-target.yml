name: Diagnose Kalshi Target
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-kalshi-target.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect live KXBTC15M market
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, datetime
          base='https://external-api.kalshi.com/trade-api/v2'
          q=urllib.parse.urlencode({'limit':100,'status':'open','series_ticker':'KXBTC15M'})
          with urllib.request.urlopen(base+'/markets?'+q, timeout=10) as r:
              data=json.load(r)
          markets=data.get('markets',[])
          print('count',len(markets))
          for m in markets[:8]:
              print(json.dumps({k:m.get(k) for k in ['ticker','title','subtitle','yes_sub_title','no_sub_title','floor_strike','cap_strike','strike_type','close_time','expiration_time','expected_expiration_time']},sort_keys=True))
          now=datetime.datetime.now(datetime.timezone.utc)
          future=[]
          for m in markets:
              raw=m.get('close_time') or m.get('expiration_time') or m.get('expected_expiration_time')
              try: dt=datetime.datetime.fromisoformat(str(raw).replace('Z','+00:00'))
              except: continue
              if dt>now: future.append((dt,m))
          if future:
              _,cur=min(future,key=lambda x:x[0])
              t=cur['ticker']
              with urllib.request.urlopen(base+'/markets/'+t, timeout=10) as r:
                  ex=json.load(r).get('market',{})
              print('CURRENT_EXACT',json.dumps({k:ex.get(k) for k in ['ticker','title','subtitle','yes_sub_title','no_sub_title','floor_strike','cap_strike','strike_type','close_time','expiration_time','expected_expiration_time']},sort_keys=True))
          PY
