name: Apply R23 Directional Call Badges

on:
  push:
    paths:
      - '.github/workflows/apply-r23-directional-call-badges.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python apply_r23_directional_call_badges.py
      - run: |
          git config user.name "btc-ai-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git commit -m "Add directional call badges across UI"
          git push origin main
