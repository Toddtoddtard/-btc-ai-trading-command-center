name: Apply R20 AI Council UI

on:
  push:
    paths:
      - 'apply_r20_ai_council_ui.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python apply_r20_ai_council_ui.py
      - run: |
          git config user.name "btc-ai-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git commit -m "Make AI Council easier to read"
          git push origin main
