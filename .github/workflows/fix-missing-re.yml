name: Fix Missing Regex Import
on:
  push:
    paths:
      - 'fix_missing_re.py'
      - '.github/workflows/fix-missing-re.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hotfix
        run: python fix_missing_re.py
      - name: Compile app
        run: python -m py_compile app.py
      - name: Verify import
        run: grep -q '^import re$' app.py
      - name: Commit fix
        run: |
          git config user.name "btc-ai-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Fix missing regex import"
          git push origin HEAD:main
