name: Restore Confidence Card Box

on:
  push:
    paths:
      - 'tools/fix_confidence_card_box_v1.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Confidence card styling
        run: python tools/fix_confidence_card_box_v1.py
      - name: Commit app.py if changed
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Restore Confidence metric card box"
          git push
