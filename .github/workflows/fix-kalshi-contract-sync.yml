name: Fix Kalshi Contract Sync
on:
  workflow_dispatch:
  push:
    paths:
      - 'fix_kalshi_contract_sync.py'
      - '.github/workflows/fix-kalshi-contract-sync.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply sync fix
        run: python fix_kalshi_contract_sync.py
      - name: Compile
        run: python -m py_compile app.py
      - name: Verify sync logic
        run: |
          grep -q 'live_ticker != cached_ticker' app.py
          grep -q 'never preserve a' app.py
      - name: Commit app fix
        run: |
          git config user.name "btc-ai-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Keep Kalshi target synced to active contract"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
