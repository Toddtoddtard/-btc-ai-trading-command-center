name: Fix Kalshi Target
on:
  workflow_dispatch:
  push:
    paths:
      - 'fix_kalshi_target.py'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python fix_kalshi_target.py
      - run: python -m py_compile app.py learner.py ai_core.py
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py learner.py
          git diff --cached --quiet || git commit -m "Fix canonical Kalshi 15m target price"
          git push
