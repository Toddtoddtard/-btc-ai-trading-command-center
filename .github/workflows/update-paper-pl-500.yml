name: Update paper P&L to $500

on:
  push:
    paths:
      - '.github/workflows/update-paper-pl-500.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply paper account update
        run: python .github/scripts/update_paper_pl_500.py
      - name: Validate Python syntax
        run: python -m py_compile app.py
      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No app.py changes to commit."
            exit 0
          fi
          git commit -m "Set paper account to $500 and show total bot P&L"
          git push origin main
