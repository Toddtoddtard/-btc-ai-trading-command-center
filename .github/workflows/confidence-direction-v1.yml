name: Install confidence direction UI

on:
  push:
    paths:
      - 'tools/apply_confidence_direction_v1.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply confidence direction UI
        run: python tools/apply_confidence_direction_v1.py
      - name: Commit app update
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Show UP DOWN direction beside Confidence"
          git push
