name: Confidence direction UI validation

on:
  push:
    paths:
      - 'app.py'
      - 'tools/apply_confidence_direction_v1.py'
      - 'tools/apply_confidence_direction_v2.py'
      - '.github/workflows/confidence-direction-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate relevant Python files
        run: python -m py_compile app.py tools/apply_confidence_direction_v1.py tools/apply_confidence_direction_v2.py
      - name: Verify confidence direction UI is installed
        run: |
          grep -q '_confidence_direction' app.py
          grep -q 'confidence-metric-card' app.py
          grep -q 'confidence-metric-label' app.py
          grep -q 'confidence-metric-value' app.py
