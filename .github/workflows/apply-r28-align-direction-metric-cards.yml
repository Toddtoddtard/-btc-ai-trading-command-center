name: Apply R28 Align Direction Metric Cards

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-r28-align-direction-metric-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align all custom decision cards with native metric cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app.py')
          s = p.read_text()

          s = re.sub(
              r'APP_VERSION = "[^"]+"',
              'APP_VERSION = "2026.09.04-single-file-r28-aligned-direction-metrics"',
              s,
              count=1,
          )

          css_extra = '''
              .direction-card.metric-direction-card {
                  min-height:92px;
                  padding:.72rem 1rem;
                  flex-direction:column;
                  align-items:flex-start;
                  justify-content:flex-start;
                  gap:.48rem;
              }
              .direction-card-label {
                  color:#9fb2ce;
                  font-size:.90rem;
                  line-height:1.15;
                  font-weight:500;
              }
              .direction-card-value {
                  width:100%;
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  flex:1;
              }
              .direction-card.metric-direction-card .direction-call {
                  min-width:min(150px, 100%);
                  max-width:100%;
                  box-sizing:border-box;
              }
          '''

          if '.direction-card.metric-direction-card {' not in s:
              pat = r'(\s*\.direction-card \.direction-call \{\s*min-width:150px; padding:10px 18px; font-size:1\.08rem;\s*\}\s*)'
              s, n = re.subn(pat, lambda m: m.group(1) + css_extra, s, count=1)
              if n != 1:
                  raise SystemExit('Could not insert aligned direction-card CSS')

          replacements = [
              (
                  r'''    with m3:\n        st\.caption\("Master"\)\n        st\.markdown\(\n            f'<div class="direction-card">\{directional_badge_html\(decision\["action"\]\)\}</div>',\n            unsafe_allow_html=True,\n        \)''',
                  '''    with m3:\n        st.markdown(\n            f'<div class="direction-card metric-direction-card"><div class="direction-card-label">Master</div><div class="direction-card-value">{directional_badge_html(decision["action"])}</div></div>',\n            unsafe_allow_html=True,\n        )''',
              ),
              (
                  r'''            with call1:\n                st\.caption\("CALL"\)\n                st\.markdown\(\n                    f'<div class="direction-card">\{directional_badge_html\(decision\["action"\]\)\}</div>',\n                    unsafe_allow_html=True,\n                \)''',
                  '''            with call1:\n                st.markdown(\n                    f'<div class="direction-card metric-direction-card"><div class="direction-card-label">CALL</div><div class="direction-card-value">{directional_badge_html(decision["action"])}</div></div>',\n                    unsafe_allow_html=True,\n                )''',
              ),
              (
                  r'''        with d1:\n            st\.caption\("Call"\)\n            st\.markdown\(\n                f'<div class="direction-card">\{directional_badge_html\(decision\["action"\]\)\}</div>',\n                unsafe_allow_html=True,\n            \)''',
                  '''        with d1:\n            st.markdown(\n                f'<div class="direction-card metric-direction-card"><div class="direction-card-label">Call</div><div class="direction-card-value">{directional_badge_html(decision["action"])}</div></div>',\n                unsafe_allow_html=True,\n            )''',
              ),
              (
                  r'''        with h3:\n            st\.caption\("Direction"\)\n            st\.markdown\(\n                f'<div class="direction-card">\{directional_badge_html\(hourly_ai\["direction"\]\)\}</div>',\n                unsafe_allow_html=True,\n            \)''',
                  '''        with h3:\n            st.markdown(\n                f'<div class="direction-card metric-direction-card"><div class="direction-card-label">Direction</div><div class="direction-card-value">{directional_badge_html(hourly_ai["direction"])}</div></div>',\n                unsafe_allow_html=True,\n            )''',
              ),
          ]

          changed = 0
          for pat, repl in replacements:
              s, n = re.subn(pat, repl, s, count=1)
              changed += n

          if changed != 4:
              raise SystemExit(f'Expected to align 4 decision cards, aligned {changed}')

          compile(s, 'app.py', 'exec')
          p.write_text(s)
          print('R28 applied: Master, Market CALL, AI Council Call, and Hourly Direction now align exactly with neighboring metric boxes.')
          PY
      - name: Validate syntax
        run: python -m py_compile app.py
      - name: Commit updated app
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes needed."
            exit 0
          fi
          git config user.name "btc-ai-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git commit -m "Align all directional decision cards with metric rows"
          git push origin main
