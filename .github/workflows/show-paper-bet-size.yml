name: Show paper trade bet size

on:
  push:
    paths:
      - '.github/workflows/show-paper-bet-size.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update app
        run: python scripts/add_paper_bet_size.py

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No app.py changes to commit."
            exit 0
          fi
          git commit -m "Show dollar bet size for paper trades"
          git push origin main
