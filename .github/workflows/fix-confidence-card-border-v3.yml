name: Fix Confidence Card Border V3

on:
  push:
    paths:
      - 'tools/fix_confidence_card_border_v3.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply robust confidence card border fix
        run: python tools/fix_confidence_card_border_v3.py
      - name: Commit app.py if changed
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Fix Confidence card border styling"
          git push
