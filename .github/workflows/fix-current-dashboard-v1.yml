name: Fix Current Dashboard V1

on:
  push:
    paths:
      - 'tools/fix_current_dashboard_v1.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply coordinated dashboard repairs
        run: python tools/fix_current_dashboard_v1.py
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Commit app.py if changed
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Fix prediction journal grading and confidence card"
          git push
