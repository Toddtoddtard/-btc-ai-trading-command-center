name: Install Kalshi contract paper v1

on:
  push:
    paths:
      - kalshi_paper_engine.py
      - tools/apply_kalshi_contract_paper_v1.py
      - .github/workflows/kalshi-contract-paper-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Apply contract paper integration
        run: python tools/apply_kalshi_contract_paper_v1.py
      - name: Validate Python
        run: python -m py_compile app.py ai_core.py kalshi_paper_engine.py
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit integrated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py ai_core.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Use Kalshi contracts for paper trading evidence"
            git push origin main
          fi
