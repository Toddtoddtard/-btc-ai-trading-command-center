name: Let paper LOCK calls enter freely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/let-paper-locks-enter-freely.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch LOCK paper-entry policy
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('kalshi_paper_engine.py')
          s = p.read_text()
          s = s.replace(
              'def open_position(db_path, starting_cash, decision, risk, spot_price):\n    side = _side_from_action(decision.get("action"))\n    if side is None or not bool(risk.get("approved")):\n        return None\n    ticker = str(decision.get("kalshi_ticker") or "")\n    if not ticker:\n        return None\n    strategy = (\n        "LOCK"\n        if str(decision.get("action", "")).upper().startswith("LOCK")\n        else "SCALP"\n    )',
              'def open_position(db_path, starting_cash, decision, risk, spot_price):\n    action = str(decision.get("action", "")).upper()\n    side = _side_from_action(action)\n    if side is None:\n        return None\n    strategy = "LOCK" if action.startswith("LOCK") else "SCALP"\n    # Explicit LOCK calls are authoritative in PAPER mode. They bypass the\n    # ordinary risk-approval/SCALP qualification gates so we can measure the\n    # bot\'s actual LOCK decisions. Hard execution constraints still apply.\n    if strategy == "SCALP" and not bool(risk.get("approved")):\n        return None\n    ticker = str(decision.get("kalshi_ticker") or "")\n    if not ticker:\n        return None'
          )
          s = s.replace(
              '        if strategy == "LOCK" and lock_target_pnl(contracts, entry) <= 1e-12:\n            return None\n',
              ''
          )
          p.write_text(s)

          p = Path('background_paper.py')
          s = p.read_text()
          old = '''    if strategy == "LOCK":\n        expected_pnl = lock_target_pnl(contracts, ask)\n        if expected_pnl <= 1e-12:\n            message = (\n                f"Skipped PAPER LOCK at {ask*100:.0f}%: selling at the 95% "\n                f"bid target would return {expected_pnl:+.2f} after estimated "\n                "Kalshi fees."\n            )\n            _record_signal_outcome(paper, pending, ticker, side, strategy, confidence, message, "BLOCKED", now)\n            return paper\n'''
          if old not in s:
              raise SystemExit('background LOCK profitability gate anchor not found')
          s = s.replace(old, '', 1)
          p.write_text(s)

          t = Path('tests/test_contract_regressions.py')
          ts = t.read_text()
          marker = 'def test_lock_can_enter_without_risk_approval_or_positive_95pct_target_pnl(self):'
          if marker not in ts:
              ts += '''\n\n\ndef test_lock_can_enter_without_risk_approval_or_positive_95pct_target_pnl(self):\n    with tempfile.TemporaryDirectory() as tmp:\n        db = tmp + "/paper-lock-free.db"\n        decision = dict(\n            action="LOCK UP",\n            kalshi_ticker="KXBTC15M-LOCK-FREE",\n            kalshi_close_ts=time.time()+900,\n            target_price=100,\n            yes_ask_dollars=.99,\n            yes_bid_dollars=.98,\n            no_ask_dollars=.02,\n            no_bid_dollars=.01,\n            confidence=.40,\n        )\n        risk = dict(approved=False, position_pct=.10)\n        opened = engine.open_position(db, 500, decision, risk, 100)\n        assert opened and opened["event"]\n        position = engine.paper_summary(db)["open_position"]\n        assert position is not None\n        assert position["strategy"] == "LOCK"\n        assert position["entry_price"] == .99\n\n\ndef test_lock_still_respects_one_lock_per_market(self):\n    with tempfile.TemporaryDirectory() as tmp:\n        db = tmp + "/paper-lock-limit.db"\n        decision = dict(\n            action="LOCK UP",\n            kalshi_ticker="KXBTC15M-LOCK-LIMIT",\n            kalshi_close_ts=time.time()+900,\n            target_price=100,\n            yes_ask_dollars=.50,\n            yes_bid_dollars=.49,\n            no_ask_dollars=.51,\n            no_bid_dollars=.50,\n            confidence=.40,\n        )\n        risk = dict(approved=False, position_pct=.10)\n        assert engine.open_position(db, 500, decision, risk, 100)\n        with engine._connect(db) as conn:\n            conn.execute("UPDATE kalshi_paper_positions SET status='CLOSED',closed_at=?,exit_price=1.0,exit_fee=0,pnl=1.0 WHERE status='OPEN'", (time.time(),))\n            conn.commit()\n        assert engine.open_position(db, 500, decision, risk, 100) is None\n'''
              t.write_text(ts)

          t = Path('tests/test_background_paper.py')
          ts = t.read_text()
          marker = 'def test_lock_can_open_above_95_even_when_95pct_exit_would_be_negative(self):'
          if marker not in ts:
              ts += '''\n\n\ndef test_lock_can_open_above_95_even_when_95pct_exit_would_be_negative():\n    state = {\n        "pending": {\n            "ticker": "KXBTC15M-LOCK-FREE",\n            "expires_at": 2000,\n            "start_price": 100000,\n            "predicted_end": 100300,\n            "target": 100000,\n            "predicted_direction": 1,\n            "master_confidence": .40,\n            "master_action": "LOCK UP",\n            "would_wait": False,\n        }\n    }\n    market = {\n        "ticker": "KXBTC15M-LOCK-FREE",\n        "status": "open",\n        "yes_bid_dollars": .98,\n        "yes_ask_dollars": .99,\n        "no_bid_dollars": .01,\n        "no_ask_dollars": .02,\n    }\n    paper = bg.run_cycle(state, lambda _: market, now=1000)\n    assert paper["open_position"] is not None\n    assert paper["open_position"]["strategy"] == "LOCK"\n    assert paper["open_position"]["entry_price"] == .99\n'''
              t.write_text(ts)
          PY

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run focused regressions
        run: python -m pytest -q tests/test_background_paper.py tests/test_contract_regressions.py

      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kalshi_paper_engine.py background_paper.py tests/test_background_paper.py tests/test_contract_regressions.py
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Let paper LOCK calls enter freely'
          git push origin main
