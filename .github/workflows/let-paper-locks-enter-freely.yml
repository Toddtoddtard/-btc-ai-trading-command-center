name: Let paper LOCK calls enter freely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/let-paper-locks-enter-freely.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch LOCK paper-entry policy
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('kalshi_paper_engine.py')
          s = p.read_text()
          old = 'def open_position(db_path, starting_cash, decision, risk, spot_price):\n    side = _side_from_action(decision.get("action"))\n    if side is None or not bool(risk.get("approved")):\n        return None\n    ticker = str(decision.get("kalshi_ticker") or "")\n    if not ticker:\n        return None\n    strategy = (\n        "LOCK"\n        if str(decision.get("action", "")).upper().startswith("LOCK")\n        else "SCALP"\n    )'
          new = 'def open_position(db_path, starting_cash, decision, risk, spot_price):\n    action = str(decision.get("action", "")).upper()\n    side = _side_from_action(action)\n    if side is None:\n        return None\n    strategy = "LOCK" if action.startswith("LOCK") else "SCALP"\n    # Explicit LOCK calls are authoritative in PAPER mode. They bypass the\n    # ordinary risk-approval/SCALP qualification gates so we can measure the\n    # bot\'s actual LOCK decisions. Hard execution constraints still apply.\n    if strategy == "SCALP" and not bool(risk.get("approved")):\n        return None\n    ticker = str(decision.get("kalshi_ticker") or "")\n    if not ticker:\n        return None'
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace('        if strategy == "LOCK" and lock_target_pnl(contracts, entry) <= 1e-12:\n            return None\n', '', 1)
          manage_gate = '''        if strategy == "LOCK" and entry_price is not None:\n            performance = paper_performance_since_update(db_path, starting_cash)\n            exposure_cap = (\n                UNPROVEN_POSITION_CAP\n                if performance["samples"] < POST_FIX_VALIDATION_TRADES\n                else 0.25\n            )\n            summary = paper_summary(db_path, starting_cash)\n            cash = float(summary["cash"])\n            pct = min(\n                exposure_cap,\n                max(0.0, _f(risk.get("position_pct"), 0.0)),\n            )\n            budget = cash * pct\n            contracts = int(budget // max(entry_price, 0.01))\n            while (\n                contracts > 0\n                and entry_price * contracts\n                + kalshi_taker_fee(contracts, entry_price)\n                > min(cash, budget)\n            ):\n                contracts -= 1\n            expected_pnl = lock_target_pnl(contracts, entry_price)\n            if contracts > 0 and expected_pnl <= 1e-12:\n                return {\n                    "event": False,\n                    "message": (\n                        f"Skipped PAPER LOCK at {entry_price * 100:.0f}%: "\n                        "selling at the 95% bid target would return "\n                        f"{expected_pnl:+.2f} after estimated Kalshi fees."\n                    ),\n                }\n\n'''
          s = s.replace(manage_gate, '', 1)
          p.write_text(s)

          p = Path('background_paper.py')
          s = p.read_text()
          old = '''    if strategy == "LOCK":\n        expected_pnl = lock_target_pnl(contracts, ask)\n        if expected_pnl <= 1e-12:\n            message = (\n                f"Skipped PAPER LOCK at {ask*100:.0f}%: selling at the 95% "\n                f"bid target would return {expected_pnl:+.2f} after estimated "\n                "Kalshi fees."\n            )\n            _record_signal_outcome(paper, pending, ticker, side, strategy, confidence, message, "BLOCKED", now)\n            return paper\n'''
          s = s.replace(old, '', 1)
          p.write_text(s)

          t = Path('tests/test_background_paper.py')
          ts = t.read_text()
          old = '''    def test_lock_rejects_fee_loss_at_95_exit(self):\n        state = self.pending(master_confidence=.60, master_action="LOCK UP")\n        paper = bg.run_cycle(\n            state,\n            lambda _: self.market(yes_bid_dollars=.94, yes_ask_dollars=.95),\n            now=1000,\n        )\n        self.assertIsNone(paper["open_position"])\n        self.assertIn("after estimated Kalshi fees", paper["last_message"])\n'''
          new = '''    def test_lock_may_enter_at_95_without_profit_gate(self):\n        state = self.pending(master_confidence=.60, master_action="LOCK UP")\n        paper = bg.run_cycle(\n            state,\n            lambda _: self.market(yes_bid_dollars=.94, yes_ask_dollars=.95),\n            now=1000,\n        )\n        self.assertIsNotNone(paper["open_position"])\n        self.assertEqual(paper["open_position"]["strategy"], "LOCK")\n        self.assertEqual(paper["open_position"]["entry_price"], .95)\n'''
          if old in ts:
              ts = ts.replace(old, new, 1)
          t.write_text(ts)

          t = Path('tests/test_contract_regressions.py')
          ts = t.read_text()
          old = '''    def test_lock_rejects_fee_loss_at_ninety_five_percent_exit(self):\n        self.decision.update(\n            action='LOCK UP',\n            confidence=.95,\n            yes_ask_dollars=.95,\n            yes_bid_dollars=.94,\n        )\n        skipped = self.cycle()\n        self.assertFalse(skipped['event'])\n        self.assertIn('after estimated Kalshi fees', skipped['message'])\n        self.assertIsNone(engine.paper_summary(self.db)['open_position'])\n        self.assertIsNone(\n            engine.open_position(self.db, 500, self.decision, self.risk, 100)\n        )\n'''
          new = '''    def test_lock_may_enter_at_ninety_five_percent_without_profit_gate(self):\n        self.decision.update(\n            action='LOCK UP',\n            confidence=.40,\n            yes_ask_dollars=.95,\n            yes_bid_dollars=.94,\n        )\n        opened = self.cycle()\n        self.assertTrue(opened['event'])\n        position = engine.paper_summary(self.db)['open_position']\n        self.assertIsNotNone(position)\n        self.assertEqual(position['strategy'], 'LOCK')\n        self.assertEqual(position['entry_price'], .95)\n'''
          if old in ts:
              ts = ts.replace(old, new, 1)
          marker = 'def test_lock_can_enter_without_risk_approval_at_99_percent():'
          if marker not in ts:
              ts += '''\n\n\ndef test_lock_can_enter_without_risk_approval_at_99_percent():\n    with tempfile.TemporaryDirectory() as tmp:\n        db = tmp + "/paper-lock-free.db"\n        decision = dict(\n            action="LOCK UP", kalshi_ticker="KXBTC15M-LOCK-FREE",\n            kalshi_close_ts=time.time()+900, target_price=100,\n            yes_ask_dollars=.99, yes_bid_dollars=.98,\n            no_ask_dollars=.02, no_bid_dollars=.01, confidence=.40,\n        )\n        risk = dict(approved=False, position_pct=.10)\n        opened = engine.open_position(db, 500, decision, risk, 100)\n        assert opened and opened["event"]\n        position = engine.paper_summary(db)["open_position"]\n        assert position is not None\n        assert position["strategy"] == "LOCK"\n        assert position["entry_price"] == .99\n'''
          t.write_text(ts)
          PY

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run focused regressions
        run: python -m pytest -q tests/test_background_paper.py tests/test_contract_regressions.py

      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kalshi_paper_engine.py background_paper.py tests/test_background_paper.py tests/test_contract_regressions.py
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Let paper LOCK calls enter freely'
          git push origin main
